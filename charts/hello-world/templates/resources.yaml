apiVersion: v1
kind: ConfigMap
metadata:
  name: hello-world
data:
  index.html: |
    {{ .Values.message }} | audience={{ .Values.audience }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-world
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hello-world
  template:
    metadata:
      labels:
        app: hello-world
      annotations:
        # Roll out a new pod whenever the rendered greeting changes.
        greeting-checksum: {{ printf "%s|%s" .Values.message .Values.audience | sha256sum | quote }}
    spec:
      containers:
        - name: web
          image: {{ .Values.image | quote }}
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: greeting
              mountPath: /usr/share/nginx/html
              readOnly: true
      volumes:
        - name: greeting
          configMap:
            name: hello-world
---
apiVersion: v1
kind: Service
metadata:
  name: hello-world
spec:
  selector:
    app: hello-world
  ports:
    - port: 80
      targetPort: 80
